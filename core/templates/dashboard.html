<!DOCTYPE html>
<html>
<head>
    <title>Horta Inteligente</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Monitoramento da Horta</h2>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Acionamentos</h5>
                        <p class="card-text fs-2">{{ acionamentos }} vezes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Tempo Total Ligada</h5>
                        <p class="card-text fs-2">{{ tempo_total }} min</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Consumo Total</h5>
                        <p class="card-text fs-2">{{ consumo }} Litros</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-4">
            <canvas id="graficoConsumo"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('graficoConsumo');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [{% for item in historico %}"{{ item.inicio|date:'d/m' }}",{% endfor %}],
                datasets: [{
                    label: 'Consumo de Água (Litros)',
                    data: [{% for item in historico %}{{ item.consumo_estimado }},{% endfor %}],
                    backgroundColor: 'rgba(54, 162, 235, 0.5)'
                }]
            }
        });
    </script>
</body>
</html>
